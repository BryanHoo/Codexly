name: Native WebView

on:
  workflow_call:
    inputs:
      run_performance:
        description: Run release-mode native performance baselines
        required: false
        type: boolean
        default: true
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 6"
  push:
    branches: [main]
    paths:
      - ".github/workflows/webview.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/**"
      - "src-tauri/**"
      - "tests/webview/**"
      - "vite.config.ts"
      - "wdio.conf.ts"
  pull_request:
    paths:
      - ".github/workflows/webview.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/**"
      - "src-tauri/**"
      - "tests/webview/**"
      - "vite.config.ts"
      - "wdio.conf.ts"

permissions:
  contents: read

concurrency:
  group: native-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows WebView2
            platform: windows-latest
            renderBudgetMs: 500
            startupBudgetMs: 5000
          - name: Ubuntu WebKitGTK
            platform: ubuntu-24.04
            renderBudgetMs: 500
            startupBudgetMs: 5000
          - name: macOS WKWebView
            platform: macos-latest
            renderBudgetMs: 400
            startupBudgetMs: 4000

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            webkit2gtk-driver \
            xdg-utils \
            xvfb

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows 上的 Tauri 测试进程存在装载器问题，真实应用链路在后续步骤覆盖相同行为。
      - name: Run real Codex lifecycle test
        if: matrix.platform != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked private_codex_should_install_and_complete_real_app_server_lifecycle -- --ignored --nocapture

      # Linux Cargo 集成测试会写入同一个 debug 二进制，最后重建以保留 WebView 测试配置。
      - name: Build native WebView test application
        run: pnpm test:webview:build

      - name: Run native WebView tests
        if: matrix.platform != 'ubuntu-24.04'
        run: pnpm test:webview

      - name: Run native WebView tests on WebKitGTK
        if: matrix.platform == 'ubuntu-24.04'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pnpm test:webview

      - name: Run real Codex WebView chain
        if: matrix.platform != 'ubuntu-24.04'
        run: pnpm test:webview:real

      - name: Run real Codex WebView chain on WebKitGTK
        if: matrix.platform == 'ubuntu-24.04'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pnpm test:webview:real

      - name: Build release native performance application
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.run_performance
        run: pnpm performance:webview:build

      - name: Check native WebView performance
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.run_performance) && matrix.platform != 'ubuntu-24.04'
        env:
          CODEAGENT_RENDER_BUDGET_MS: ${{ matrix.renderBudgetMs }}
          CODEAGENT_STARTUP_BUDGET_MS: ${{ matrix.startupBudgetMs }}
        run: pnpm performance:webview

      - name: Check native WebView performance on WebKitGTK
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.run_performance) && matrix.platform == 'ubuntu-24.04'
        env:
          CODEAGENT_RENDER_BUDGET_MS: ${{ matrix.renderBudgetMs }}
          CODEAGENT_STARTUP_BUDGET_MS: ${{ matrix.startupBudgetMs }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pnpm performance:webview
