<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" role="img">
  <title>Codexly</title>
  <style>
    .logo-background { fill: #171717; }
    .brand-symbol {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 5;
    }
    .brand-chevron { stroke: #ffffff; }
    .brand-cursor { stroke: #339cff; }
    .logo-text {
      fill: #111111;
      font-family: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: 0;
    }

    @media (prefers-color-scheme: dark) {
      .logo-text { fill: #ffffff; }
    }
  </style>

  <rect class="logo-background" width="64" height="64" rx="14" />
  <!-- 与独立 mark、favicon 共用完全一致的 `>_` 几何。 -->
  <g id="codexly-symbol" class="brand-symbol" aria-hidden="true">
    <path class="brand-chevron" d="m19 24 8 8-8 8" />
    <path class="brand-cursor" d="M34 40h12" />
  </g>
  <text class="logo-text" x="78" y="32" dominant-baseline="central">Codexly</text>
</svg>
