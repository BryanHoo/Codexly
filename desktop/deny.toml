[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
  # Tauri 2.11.5 的 Linux GTK 栈仍依赖 glib 0.18；上游升级到 0.20 后移除此例外。
  { id = "RUSTSEC-2024-0429", reason = "Tauri 2.11.5 Linux dependencies still require glib 0.18" },
]

[bans]
# 重复版本先作为可见警告，避免现有传递依赖阻塞安全检查。
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[licenses]
# 仅允许项目当前依赖采用的宽松许可证。
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[[licenses.clarify]]
crate = "tauri-nspanel@2.1.0"
expression = "MIT OR Apache-2.0"
license-files = [
  # 固定提交的 README 明确声明许可证，哈希用于防止声明被静默修改。
  { path = "README.md", hash = 0x55b7b842 },
]

[sources]
# crates.io 由 cargo-deny 默认信任，其他来源必须显式列入白名单并固定到 rev。
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
  "https://github.com/ahkohd/tauri-nspanel",
]
