# 窗口只能通过 capability 引用对应集合，新增命令不会自动获得调用权限。

[[set]]
identifier = "main-window-commands"
description = "Allows the main window to call the application commands used by the workbench."
permissions = [
  "allow-record-frontend-diagnostic",
  "allow-export-diagnostics",
  "allow-read-acp-agent",
  "allow-read-acp-scheduled-config",
  "allow-set-acp-scheduled-config",
  "allow-acp-agent-request",
  "allow-acp-plan-request",
  "allow-application-preferences-request",
  "allow-acp-task-request",
  "allow-create-acp-task",

  "allow-enable-autostart",
  "allow-get-tray-icon-visible",
  "allow-set-tray-icon-visible",
  "allow-connect-project-terminals",
  "allow-create-project-terminal",
  "allow-write-project-terminal",
  "allow-resize-project-terminal",
  "allow-ack-project-terminal",
  "allow-close-project-terminal",
  "allow-remove-project-terminal",
  "allow-initialize-app-storage",
  "allow-update-app-preferences",
  "allow-list-custom-backgrounds",
  "allow-read-custom-background",
  "allow-update-custom-backgrounds",
  "allow-connect-runtime",
  "allow-acknowledge-runtime-events",

  "allow-cancel-native-request",
  "allow-get-app-info",
  "allow-install-app-update",
  "allow-get-runtime-performance-metrics",
  # 导出只能写入原生保存窗口选中的路径，不提供任意文件写入命令。
  "allow-save-conversation-export",
  "allow-get-task-activities",
  "allow-acknowledge-task-activity",
  "allow-dismiss-task-notifications",

  "allow-configure-desktop-pet",
  "allow-get-workbench-background",
  "allow-list-workbench-backgrounds",
  "allow-download-workbench-background",
  "allow-list-workbench-pets",
  "allow-download-workbench-pet",

  "allow-get-temporary-workspace-settings",
  "allow-choose-temporary-workspace-root",
    "allow-sync-saved-prompts",

  "allow-list-projects",
  "allow-add-project",
  "allow-rename-project",
  "allow-remove-project",
  "allow-reorder-projects",
  "allow-list-project-directories",
  "allow-create-project-directory",
  "allow-list-completed-tasks",
  "allow-list-tasks",
  "allow-search-tasks",
  "allow-search-task-occurrences",
  "allow-start-task",

  "allow-resolve-pending-request",

  "allow-list-project-files",
  "allow-search-project-files",
  "allow-stop-project-file-search",
  "allow-create-project-file",
  "allow-rename-project-file",
  "allow-delete-project-file",
  "allow-open-project-file-window",
  "allow-read-project-source-file",
  "allow-read-project-text-file",
  "allow-read-project-text-file-revision",
  "allow-save-project-text-file",
  "allow-get-project-git-status",
  "allow-get-project-git-history",
  "allow-get-project-git-commit-files",
  "allow-get-project-git-commit-file-diff",
  "allow-switch-project-branch",
  "allow-create-project-branch",
  "allow-list-project-worktrees",
  "allow-create-task-worktree",
  "allow-start-worktree-task",
  "allow-generate-commit-message",
  "allow-optimize-prompt",
  "allow-discard-project-changes",
  "allow-commit-project-changes",
  # Git 远端操作仅供主窗口使用，辅助窗口不继承此写权限。
  "allow-push-project-commits",
  "allow-upload-attachment",
  "allow-import-host-attachment",
  "allow-cache-project-image",
  "allow-get-project-pdf-file",
  "allow-list-host-files",
  "allow-get-project-open-capabilities",
  "allow-open-project",
  "allow-open-task-attachment",
  "allow-list-scheduled-tasks",
  "allow-preview-scheduled-task",
  "allow-create-scheduled-task",
  "allow-update-scheduled-task",
  "allow-delete-scheduled-task",
  "allow-set-scheduled-task-enabled",
  "allow-run-scheduled-task-now",
  "allow-rename-task",
  "allow-pin-task",

]

[[set]]
identifier = "project-file-window-commands"
description = "Allows project file windows to preview and edit scoped project text files."
permissions = [
  "allow-record-frontend-diagnostic",
  "allow-initialize-app-storage",
  # 独立文件窗口的 Markdown 预览切换沿用共享偏好存储，需要允许持久化。
  "allow-update-app-preferences",
  "allow-read-project-source-file",
  "allow-read-project-text-file",
  "allow-read-project-text-file-revision",
  "allow-save-project-text-file",
  "allow-cache-project-image",
  "allow-get-project-pdf-file",
  "allow-open-project",
  "core:window:allow-close",
  # 关闭监听放行后由 Tauri 调用 destroy，缺少此权限会让原生关闭和预览关闭按钮均失效。
  "core:window:allow-destroy",
  "core:event:allow-listen",
  "core:event:allow-unlisten",
]

[[set]]
identifier = "desktop-pet-window-commands"
description = "Allows the desktop pet window to call only its rendering and navigation commands."
permissions = [
  "allow-record-frontend-diagnostic",
  "allow-get-desktop-pet-state",
  "allow-get-desktop-pet-drag-strategy",
  "allow-get-desktop-pet-position",
  "allow-show-desktop-pet",
  "allow-set-desktop-pet-drag-position",
  "allow-start-desktop-pet-native-drag",
  "allow-move-desktop-pet",
  "allow-layout-desktop-pet",
  "allow-open-desktop-pet-task",
  "allow-list-workbench-pets",
]
