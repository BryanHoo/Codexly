<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Codexly</title>
  <style>
    .mark-background { fill: #171717; }
    .brand-symbol {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 5;
    }
    .brand-chevron { stroke: #ffffff; }
    .brand-cursor { stroke: #339cff; stroke-width: 4.25; }
  </style>

  <rect class="mark-background" width="64" height="64" rx="14" />
  <!-- 白色提示符表达 Coding Agent，蓝色光标提供 Codexly 品牌识别。 -->
  <g id="codexly-symbol" class="brand-symbol" aria-hidden="true">
    <path class="brand-chevron" d="m18 22 10 10-10 10" />
    <path class="brand-cursor" d="M34 42h12" />
  </g>
</svg>
