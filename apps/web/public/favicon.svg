<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .mark-background { fill: #171717; }
    .brand-symbol {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 5;
    }
    .brand-chevron { stroke: #ffffff; }
    .brand-cursor { stroke: #339cff; }
  </style>

  <rect class="mark-background" width="64" height="64" rx="14" />
  <!-- favicon 直接复用品牌核心几何，避免缩小时出现不同版本。 -->
  <g id="codexly-symbol" class="brand-symbol" aria-hidden="true">
    <path class="brand-chevron" d="m19 24 8 8-8 8" />
    <path class="brand-cursor" d="M34 40h12" />
  </g>
</svg>
