name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Resolve immutable commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "v${package_version}" != "${RELEASE_TAG}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi
          # 标签与后续任务使用同一不可变提交，避免校验期间标签移动造成错配。
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
      - name: Verify joint release version and unified notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node tools/joint-release.mjs --check
      - name: Verify desktop signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required' >&2; exit 1; }
      - name: Verify macOS signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # 联合发布开始前检查签名与公证凭据，避免耗时构建后才发现 macOS 无法分发。
          # 只输出缺失的变量名，禁止把证书、导出密码或 App 专用密码写入日志。
          for credential in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            test -n "${!credential}" || { echo "${credential} is required" >&2; exit 1; }
          done

  desktop-quality:
    name: Desktop quality gate
    needs: prepare
    uses: ./.github/workflows/desktop-quality.yml

  desktop-webview:
    name: Desktop native WebView gate
    needs: prepare
    uses: ./.github/workflows/desktop-webview.yml
    with:
      run_performance: true

  e2e:
    name: Release E2E (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build and run browser tests
        run: |
          pnpm run build
          pnpm exec playwright test

  publish-npm:
    name: Publish npm package
    needs: [prepare, e2e, desktop-quality, desktop-webview, publish-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gates
        shell: bash
        run: |
          pnpm run audit:prod
          pnpm run codex:schema:check
          pnpm run format:check
          pnpm run lint
          pnpm run lint:architecture
          # 分组结束后释放 Vitest 与原生模块进程，避免长套件在托管 runner 尾段崩溃。
          CI='' pnpm exec vitest run --pool forks --maxWorkers 1 --no-file-parallelism --passWithNoTests apps/web
          CI='' pnpm exec vitest run --pool forks --maxWorkers 1 --no-file-parallelism --passWithNoTests packages/client packages/core packages/protocol
          CI='' pnpm exec vitest run --pool forks --maxWorkers 1 --no-file-parallelism --passWithNoTests packages/provider-codex
          CI='' pnpm exec vitest run --pool forks --maxWorkers 1 --no-file-parallelism --passWithNoTests packages/server
          CI='' pnpm exec vitest run --pool forks --maxWorkers 1 --no-file-parallelism --passWithNoTests "$PWD"/src/*.test.ts "$PWD"/tests/*.test.ts --exclude packages/protocol/src/app-update.test.ts
          pnpm run test:release
          pnpm run test:highlight
          pnpm run test:performance
          pnpm run build:clean
          pnpm run bundle:check
          pnpm run package:check
      # 发布前固定 npm 版本，确保 Trusted Publisher 的 OIDC 认证行为一致。
      - name: Setup publishing npm
        run: npm install --global npm@11.5.1
      - name: Publish with provenance
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping pnpm publish."
          else
            # pnpm 负责转换 Workspace 协议，npm CLI 负责 Trusted Publisher OIDC 认证。
            package_tarball="${RUNNER_TEMP}/codexly-${package_version}.tgz"
            pnpm pack --out "${package_tarball}"
            npm publish "${package_tarball}" --access public --provenance
          fi
  publish-desktop:
    name: ${{ matrix.name }}
    needs: [prepare, e2e, desktop-quality, desktop-webview]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 Portable
            platform: windows-latest
            args: --no-bundle --no-sign --ci
            rustTargets: ""
            portable: true
            uploadPlainBinary: false
            uploadUpdaterArtifacts: false
            releaseAssetNamePattern: "[name]_[version]_[arch]_portable[ext]"
          - name: Windows x64 NSIS
            platform: windows-latest
            args: --bundles nsis --ci
            rustTargets: ""
            uploadPlainBinary: false
            uploadUpdaterArtifacts: true
            releaseAssetNamePattern: ""
          - name: Ubuntu x64 DEB and AppImage
            platform: ubuntu-24.04
            args: --bundles deb,appimage --ci
            rustTargets: ""
            uploadPlainBinary: false
            uploadUpdaterArtifacts: true
            releaseAssetNamePattern: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg --ci
            rustTargets: aarch64-apple-darwin
            uploadPlainBinary: false
            uploadUpdaterArtifacts: true
            releaseAssetNamePattern: ""
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg --ci
            rustTargets: x86_64-apple-darwin
            uploadPlainBinary: false
            uploadUpdaterArtifacts: true
            releaseAssetNamePattern: ""
          - name: macOS Intel Legacy
            platform: macos-latest
            args: --target x86_64-apple-darwin --config src-tauri/tauri.macos-legacy.conf.json --bundles app,dmg --ci
            rustTargets: x86_64-apple-darwin
            macosProfile: legacy
            uploadPlainBinary: false
            uploadUpdaterArtifacts: false
            releaseAssetNamePattern: "[name]_[version]_[arch]_legacy[ext]"
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rustTargets }}
      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./desktop/src-tauri -> target"
      - name: Install desktop dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Verify desktop version
        working-directory: desktop
        shell: bash
        run: RELEASE_TAG="v$(node --print "require('./package.json').version")" pnpm version:check
      - name: Build and upload desktop artifacts to draft
        if: ${{ !matrix.portable }}
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODEAGENT_MACOS_PROFILE: ${{ matrix.macosProfile || 'modern' }}
          CARGO_TARGET_DIR: ${{ matrix.macosProfile == 'legacy' && format('{0}/desktop/src-tauri/target/legacy', github.workspace) || format('{0}/desktop/src-tauri/target', github.workspace) }}
          # Tauri 原生导入 p12、使用 Developer ID 签名并公证、装订票据；三种 macOS 产物共用配置。
          # Apple 凭据仅传给 macOS 构建，Windows 和 Linux 不接收这些密钥。
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Codexly ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          uploadUpdaterJson: ${{ matrix.uploadUpdaterArtifacts }}
          uploadUpdaterSignatures: ${{ matrix.uploadUpdaterArtifacts }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.macosProfile == 'legacy' && '[platform]-[arch]-[bundle]-legacy' || '' }}
          releaseAssetNamePattern: ${{ matrix.releaseAssetNamePattern }}
          args: ${{ matrix.args }}
      - name: Build Windows portable application
        if: matrix.portable
        working-directory: desktop
        run: pnpm tauri build --no-bundle --no-sign --ci
      - name: Package Windows portable runtime
        if: matrix.portable
        shell: pwsh
        run: |
          # 便携版必须连同只读运行时分发，裸 exe 无法提供离线启动所需依赖。
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portableRoot = Join-Path $env:RUNNER_TEMP 'codexly-portable'
          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
          Copy-Item desktop/src-tauri/target/release/codexly.exe $portableRoot
          Copy-Item desktop/src-tauri/binaries/claude-host-x86_64-pc-windows-msvc.exe (Join-Path $portableRoot 'claude-host.exe')
          Copy-Item desktop/src-tauri/resources/runtime (Join-Path $portableRoot 'runtime') -Recurse
          $archive = Join-Path $env:RUNNER_TEMP "Codexly_${version}_x64_portable.zip"
          Compress-Archive -Path "$portableRoot/*" -DestinationPath $archive -CompressionLevel Optimal
      - name: Preserve Windows portable archive
        if: matrix.portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-portable
          path: ${{ runner.temp }}/Codexly_*_x64_portable.zip
      - name: Verify macOS signed and notarized app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_TARGET: ${{ matrix.rustTargets }}
          MACOS_PROFILE: ${{ matrix.macosProfile || 'modern' }}
        run: |
          # 验证实际产物；票据或 Gatekeeper 校验失败时，联合 Release 必须保持草稿。
          bundle_root="desktop/src-tauri/target"
          if [[ "${MACOS_PROFILE}" == 'legacy' ]]; then
            bundle_root="${bundle_root}/legacy"
          fi
          app_path="${bundle_root}/${MACOS_TARGET}/release/bundle/macos/Codexly.app"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"
      - name: Publish isolated Legacy updater metadata
        if: matrix.macosProfile == 'legacy'
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          APP_VERSION: ${{ steps.build.outputs.appVersion }}
          JOINT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/legacy-release.mjs
          gh release upload "${JOINT_RELEASE_TAG}" "${RUNNER_TEMP}/latest-legacy.json" --clobber

  release:
    name: Publish joint GitHub release
    needs: [prepare, publish-npm, publish-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Extract release notes
        shell: bash
        run: |
          release_notes="${RUNNER_TEMP}/release-notes.md"
          node ./tools/joint-release.mjs --notes "${release_notes}"
          echo "RELEASE_NOTES_PATH=${release_notes}" >> "${GITHUB_ENV}"
      - name: Download Windows portable archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-portable
          path: ${{ runner.temp }}/portable
      - name: Upload complete Windows portable archive
        run: gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}"/portable/Codexly_*_x64_portable.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish draft release
        run: gh release edit "${RELEASE_TAG}" --notes-file "${RELEASE_NOTES_PATH}" --title "Codexly ${RELEASE_TAG}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
