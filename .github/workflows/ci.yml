name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gates
        run: pnpm check
      # 覆盖率阈值只在 Linux 执行，避免 Windows 矩阵重复生成报告。
      - name: Enforce coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage
      # 只读展示质量门禁生成的机器报告，不再次分析 production 产物。
      - name: Show Web Bundle report
        run: pnpm run bundle:report

  macos-smoke:
    name: macOS smoke
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 在真实 Darwin runner 上验证 Web 目录浏览、原生 Codex 包解析与宿主命令分支，不重复完整 E2E。
      - name: Run macOS smoke tests
        run: |
          test_files=(
            packages/server/src/project-directory-browser.test.ts
            apps/web/src/features/projects/components/project-directory-picker-dialog.test.tsx
            src/system-browser.test.ts
            packages/server/src/project-open.test.ts
            packages/provider-codex/src/binary.test.ts
          )
          # Vitest 会忽略不存在的过滤项，运行前必须逐项校验。
          for test_file in "${test_files[@]}"; do
            if [[ ! -f "${test_file}" ]]; then
              echo "::error file=${test_file}::Missing macOS smoke test file"
              exit 1
            fi
          done
          pnpm exec vitest run "${test_files[@]}"

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: pnpm test:e2e
