name: Desktop Quality

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "packages/**"
      - ".github/workflows/desktop-quality.yml"
      - ".node-version"
      - "package.json"
      - "schemas/codex-app-server/**"
      - "tools/verify-codex-schema.mjs"
      - "tools/*runtime*"
      - "tools/*claude*"
      - "tools/runtime-licenses/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "desktop/**"
      - "packages/**"
      - ".github/workflows/desktop-quality.yml"
      - ".node-version"
      - "package.json"
      - "schemas/codex-app-server/**"
      - "tools/verify-codex-schema.mjs"
      - "tools/*runtime*"
      - "tools/*claude*"
      - "tools/runtime-licenses/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  protocol-contract:
    name: Codex Protocol Contract
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Check Codex protocol schema
        run: pnpm codex:protocol:check

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit production Node dependencies
        run: pnpm audit --prod

      - name: Check supply-chain policy
        run: pnpm supply-chain:policy:test

      - name: Audit Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
          manifest-path: ./desktop/src-tauri/Cargo.toml

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Check standalone Claude host and distribution contract
        working-directory: .
        run: pnpm test:claude-host

      - name: Check web
        run: pnpm check:web

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Check browser components
        # 两次完整运行共用上限，浏览器失联却未退出时也必须终止门禁。
        timeout-minutes: 10
        run: pnpm test:browser:ci

      - name: Upload browser test failure artifacts
        # 发生过连接恢复时，即使完整重跑成功，也保留两次报告供维护者核对。
        if: failure() || hashFiles('desktop/test-results/browser-attempt-2.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-browser-failure-${{ github.run_id }}
          path: |
            desktop/test-results/
            desktop/src/**/__screenshots__/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check macOS build isolation and compiled Legacy theme
        run: pnpm test:macos-build-output

      - name: Check source open performance
        run: pnpm performance:browser

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            libglib2.0-bin \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled desktop runtimes
        working-directory: .
        run: pnpm build:desktop-runtime && node --test tools/desktop-runtime-bundle.test.mjs

      - name: Check Rust
        run: pnpm check:rust
