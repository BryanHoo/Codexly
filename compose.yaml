services:
  codexly:
    image: ghcr.io/bryanhoo/codexly:${CODEXLY_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODEXLY_PORT:-3210}:${CODEXLY_PORT:-3210}"
    command: ["start", "--lan"]
    environment:
      CODEXLY_ALLOWED_HOSTS: ${CODEXLY_ALLOWED_HOSTS:-}
      CODEXLY_LAN_PASSWORD: ${CODEXLY_LAN_PASSWORD:-}
      CODEXLY_PORT: ${CODEXLY_PORT:-3210}
      CODEXLY_SESSION_TTL: ${CODEXLY_SESSION_TTL:-}
      CODEXLY_WORKSPACE: ${CODEXLY_WORKSPACE_TARGET:-${CODEXLY_WORKSPACE:-/workspace}}
      CODEXLY_GIT_CONFIG: ${CODEXLY_GIT_CONFIG:-/home/node/.gitconfig}
    volumes:
      - ${CODEXLY_CODEX_HOME:-codexly-data}:/home/node/.codex
      # SSH 配置和私钥保持只读；未配置宿主目录时使用隔离命名卷。
      - ${CODEXLY_SSH_HOME:-codexly-ssh}:/home/node/.ssh:ro
      # 显式工作区保留宿主绝对路径，使复用 Codex Home 时的项目记录仍然有效。
      - type: bind
        source: ${CODEXLY_WORKSPACE:-/}
        target: ${CODEXLY_WORKSPACE_TARGET:-${CODEXLY_WORKSPACE:-/workspace}}
    stop_grace_period: 30s

volumes:
  codexly-data:
  codexly-ssh:
